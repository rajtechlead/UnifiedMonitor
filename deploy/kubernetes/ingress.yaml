apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unimonitor
  namespace: unimonitor
  labels:
    app.kubernetes.io/name: unimonitor
  annotations:
    # nginx ingress controller annotations
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # TLS certificate via cert-manager (optional)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  ingressClassName: nginx
  # Uncomment for TLS:
  # tls:
  #   - hosts:
  #       - unimonitor.example.com
  #     secretName: unimonitor-tls
  rules:
    - host: unimonitor.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unimonitor-api
                port:
                  number: 80
---
# HPA for API pods
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unimonitor-api
  namespace: unimonitor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unimonitor-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# HPA for worker pods
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unimonitor-worker
  namespace: unimonitor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unimonitor-worker
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
