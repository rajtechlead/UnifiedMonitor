[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unimonitor"
version = "1.0.0"
description = "UniMonitor – Unified Monitoring and GRC Solution for Microsoft 365"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
authors = [{ name = "rajtechlead", email = "rajrsngroup@gmail.com" }]
maintainers = [{ name = "rajtechlead", email = "rajrsngroup@gmail.com" }]
keywords = ["microsoft365", "security", "grc", "compliance", "monitoring", "intune", "defender", "entra"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "psycopg2-binary>=2.9.9",

    # Caching / task queue
    "redis>=5.0.4",
    "celery[redis]>=5.4.0",
    "kombu>=5.3.5",

    # Microsoft Graph / Auth
    "msgraph-sdk>=1.4.0",
    "msal>=1.28.0",
    "msal-extensions>=1.1.0",
    "azure-identity>=1.17.0",

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # HTTP
    "httpx>=0.27.0",
    "tenacity>=8.3.0",

    # Logging / telemetry
    "structlog>=24.2.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",

    # Auth / security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",

    # Reporting
    "reportlab>=4.2.0",
    "weasyprint>=62.0",
    "openpyxl>=3.1.4",
    "jinja2>=3.1.4",

    # Utilities
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "click>=8.1.7",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "orjson>=3.10.3",
]

[project.urls]
Homepage = "https://github.com/rajtechlead/UniMonitor"
Repository = "https://github.com/rajtechlead/UniMonitor"
"Bug Tracker" = "https://github.com/rajtechlead/UniMonitor/issues"
Changelog = "https://github.com/rajtechlead/UniMonitor/blob/main/docs/CHANGELOG.md"

[project.optional-dependencies]
azure-secrets = [
    "azure-keyvault-secrets>=4.8.0",
    "azure-identity>=1.17.0",
]
aws-secrets = [
    "boto3>=1.34.0",
]
all-secrets = [
    "azure-keyvault-secrets>=4.8.0",
    "azure-identity>=1.17.0",
    "boto3>=1.34.0",
]
production = [
    "azure-keyvault-secrets>=4.8.0",
    "azure-identity>=1.17.0",
    "boto3>=1.34.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.2.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "moto[secretsmanager]>=5.0.0",
]

[project.scripts]
unimonitor = "unimonitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["unimonitor"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "T20"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["unimonitor"]
omit = ["*/migrations/*", "*/tests/*"]
