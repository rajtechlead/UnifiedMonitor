name: Windows Installer

# Builds UniMonitor-Setup-<version>-x64.exe on a Windows runner.
#
# Dispatch-only on purpose: the release pipeline (release.yml) already builds the
# installer on a version tag, and CI runs on every push — this gives a manual
# "just build me the installer" path without burning extra Actions minutes on
# every commit.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (e.g. 1.0.0)"
        required: false
        default: "1.1.0"

env:
  PYTHON_VER: "3.12"
  NODE_VER: "20"

jobs:
  build-installer:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # The Zero Trust runner is bundled as a download in the app; a syntax error
      # would only surface on a customer's workstation, so parse it here.
      - name: Validate the Zero Trust Assessment runner
        shell: pwsh
        run: |
          $path = "scripts/zerotrust/Invoke-UniMonitorZeroTrust.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "$path parses cleanly"

      # ── Python + build dependencies ────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VER }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}
          cache: pip

      - name: Install PyInstaller and app dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # 6.15+ is required for Python 3.12/3.13/3.14
          pip install "pyinstaller>=6.16.0,<7"
          # production extra: the AWS/GCP collectors need boto3 at runtime
          pip install -e ".[production]"

      # ── Frontend (embedded into the bundle) ───────────────────────────────
      - name: Set up Node.js ${{ env.NODE_VER }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VER }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build React frontend
        shell: pwsh
        run: |
          cd frontend
          npm ci
          npm run build
          if (!(Test-Path "../unimonitor/static")) { mkdir "../unimonitor/static" }
          Copy-Item -Recurse -Force dist/* ../unimonitor/static/

      # ── Freeze the application ────────────────────────────────────────────
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller deploy/windows/unimonitor.spec --clean --noconfirm
          if (!(Test-Path "dist/UniMonitor/UniMonitor.exe")) {
            Write-Error "PyInstaller failed — UniMonitor.exe not found"
            exit 1
          }
          Write-Host "Packaged files:" (Get-ChildItem dist/UniMonitor -Recurse | Measure-Object).Count
          # The Zero Trust page downloads this from the bundle; fail if it is missing.
          # PyInstaller 6 onedir puts collected data under _internal\, older builds
          # beside the exe, so accept either location.
          $runner = @(
            "dist/UniMonitor/_internal/scripts/zerotrust/Invoke-UniMonitorZeroTrust.ps1",
            "dist/UniMonitor/scripts/zerotrust/Invoke-UniMonitorZeroTrust.ps1"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$runner) {
            Write-Error "PyInstaller did not bundle scripts/zerotrust/Invoke-UniMonitorZeroTrust.ps1"
            exit 1
          }
          Write-Host "Bundled Zero Trust runner:" $runner

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          # Not Start-Process: on PowerShell 7 a -PassThru process started with
          # -NoNewWindow and redirection reports a $null ExitCode (PowerShell issue
          # #20400), so a healthy exe failed this step with no code and no output.
          $info = [System.Diagnostics.ProcessStartInfo]::new()
          $info.FileName = "dist/UniMonitor/UniMonitor.exe"
          $info.Arguments = "--help"
          $info.UseShellExecute = $false
          $info.RedirectStandardOutput = $true
          $info.RedirectStandardError = $true
          $p = [System.Diagnostics.Process]::Start($info)
          $outTask = $p.StandardOutput.ReadToEndAsync()
          $errTask = $p.StandardError.ReadToEndAsync()
          if (-not $p.WaitForExit(90000)) {
            $p.Kill()
            Write-Error "UniMonitor.exe --help did not exit within 90s"
            exit 1
          }
          $out = $outTask.GetAwaiter().GetResult()
          $err = $errTask.GetAwaiter().GetResult()
          Set-Content -Path "exe-stdout.txt" -Value $out
          Set-Content -Path "exe-stderr.txt" -Value $err
          Write-Host $out
          Write-Host $err
          if ($p.ExitCode -ne 0) {
            Write-Error "UniMonitor.exe --help exited with $($p.ExitCode)"
            exit 1
          }
          if ($out -notmatch "Usage") {
            Write-Error "UniMonitor.exe --help produced no usage text"
            exit 1
          }

      # ── Windows service helper + docs ─────────────────────────────────────
      - name: Download NSSM (Windows Service helper)
        shell: pwsh
        run: |
          # nssm.cc regularly answers 503 from its own front end; retry, then
          # fall back to the archive mirror, and verify the pinned SHA-256.
          $urls = @(
            "https://nssm.cc/release/nssm-2.24.zip",
            "https://web.archive.org/web/2024id_/https://nssm.cc/release/nssm-2.24.zip"
          )
          foreach ($url in $urls) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try { Invoke-WebRequest -Uri $url -OutFile nssm.zip; break }
              catch {
                Write-Host "$url attempt $attempt failed: $($_.Exception.Message)"
                Remove-Item nssm.zip -ErrorAction SilentlyContinue
                if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
              }
            }
            if (Test-Path nssm.zip) { break }
          }
          if (-not (Test-Path nssm.zip)) { throw "NSSM 2.24 could not be downloaded" }
          $hash = (Get-FileHash nssm.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "727d1e42275c605e0f04aba98095c38a8e1e46def453cdffce42869428aa6743") {
            throw "NSSM checksum mismatch: downloaded $hash"
          }
          Expand-Archive nssm.zip -DestinationPath nssm_tmp
          Copy-Item nssm_tmp/nssm-2.24/win64/nssm.exe dist/UniMonitor/nssm.exe
          Remove-Item -Recurse nssm.zip, nssm_tmp

      - name: Copy INSTALL.md into bundle
        shell: pwsh
        run: |
          if (Test-Path "INSTALL.md") { Copy-Item INSTALL.md dist/UniMonitor/INSTALL.md }

      # ── NSIS wrapper ──────────────────────────────────────────────────────
      - name: Resolve installer version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (!$version) { $version = "1.1.0" }
          $version = $version.TrimStart('v')
          Write-Host "Building installer for version $version"
          echo "INSTALLER_VERSION=$version" >> $env:GITHUB_ENV

      - name: Verify branding assets
        shell: pwsh
        run: |
          # NSIS aborts if its icon is missing, so fail loudly with the fix.
          if (!(Test-Path "branding/icon.ico")) {
            Write-Error "branding/icon.ico is missing. Regenerate it with: python scripts/make_icon.py"
            exit 1
          }
          Write-Host "Using branding/icon.ico" ((Get-Item branding/icon.ico).Length) "bytes"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          # choco updates the machine PATH, but this process never sees it — so
          # resolve makensis explicitly and export its folder for later steps.
          $makensis = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe",
            (Get-Command makensis -ErrorAction SilentlyContinue).Source
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (!$makensis) {
            Write-Error "NSIS installed but makensis.exe was not found"
            exit 1
          }
          Split-Path $makensis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $makensis /VERSION

      - name: Build NSIS installer
        shell: pwsh
        run: |
          makensis `
            /V4 `
            "/DVERSION=${{ env.INSTALLER_VERSION }}" `
            deploy/windows/install.nsi
          if ($LASTEXITCODE -ne 0) {
            Write-Error "makensis failed with exit code $LASTEXITCODE"
            exit 1
          }
          $exe = "dist/UniMonitor-Setup-${{ env.INSTALLER_VERSION }}-x64.exe"
          if (!(Test-Path $exe)) {
            Write-Error "NSIS reported success but $exe is missing"
            exit 1
          }
          $sizeMb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "Installer created: $exe ($sizeMb MB)"

      - name: Create portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/UniMonitor/* `
            -DestinationPath "dist/UniMonitor-${{ env.INSTALLER_VERSION }}-x64-portable.zip"

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ env.INSTALLER_VERSION }}
          retention-days: 30
          path: |
            dist/UniMonitor-Setup-*.exe
            dist/UniMonitor-*-portable.zip
          if-no-files-found: error
