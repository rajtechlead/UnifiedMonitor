# SonarCloud analysis scope.
#
# Generated and vendored files are excluded by design: the Zero Trust catalogue is
# produced by scripts/import_zt_tests.py, the reference clones are third-party
# upstream repositories, and the Alembic migrations are historical snapshots that
# must not be edited after release.
sonar.sources=unimonitor,scripts,alembic,frontend/src
sonar.tests=tests
sonar.exclusions=\
  unimonitor/zerotrust/microsoft_tests.py,\
  alembic/versions/**,\
  graphify-out/**,\
  reference/**,\
  frontend/dist/**,\
  frontend/node_modules/**,\
  **/*.min.js
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
