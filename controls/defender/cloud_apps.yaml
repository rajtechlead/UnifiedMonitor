# UniMonitor GRC Controls — Defender: Cloud Apps (MDCA)

controls:
  - id: CTRL-DEF-024
    title: "Cloud Discovery Log Collection Configured"
    description: >
      Defender for Cloud Apps must receive traffic logs (from Defender for Endpoint, Zscaler,
      or a log collector) so shadow IT usage is discovered rather than assumed absent.
    severity: HIGH
    category: defender
    service: defender_cloud_apps
    compliance_mapping:
      iso27001_2022:
        - "A.8.20"
      nist_csf_2:
        - "ID.AM-03"
      nist_800_53_r5:
        - "CM-8"
      cis_controls_v8:
        - "13.6"
      cis_m365_benchmark:
        - "6.4.1"
      soc2:
        - "CC6.6"
    rationale: "Cloud Discovery is the only source of unsanctioned application visibility."
    remediation: |
      1. Defender for Cloud Apps > Settings > Cloud Discovery > Automatic log upload
      2. Enable Microsoft Defender for Endpoint integration for automatic forwarding
      3. Or deploy a Docker log collector and connect it to your proxy or firewall
      4. Verify the discovery dashboard reports traffic
    references:
      - https://learn.microsoft.com/en-us/defender-cloud-apps/set-up-cloud-discovery
    evaluate: |
      discovery = data.get("cloud_discovery_settings", {})
      if not discovery:
          return "not_implemented"
      sources = discovery.get("logCollectors") or discovery.get("dataSources") or []
      if sources and discovery.get("isEnabled", True):
          return "implemented"
      return "partially_implemented" if discovery else "not_implemented"

  - id: CTRL-DEF-025
    title: "App Connectors Configured and Healthy"
    description: >
      App connectors must be configured for Microsoft 365 and other sanctioned cloud services,
      with API status healthy, so activity and file events are ingested for policy evaluation.
    severity: HIGH
    category: defender
    service: defender_cloud_apps
    compliance_mapping:
      iso27001_2022:
        - "A.8.15"
      nist_csf_2:
        - "DE.AE-03"
      nist_800_53_r5:
        - "AU-6"
      cis_controls_v8:
        - "8.11"
      cis_m365_benchmark:
        - "6.4.1"
      soc2:
        - "CC7.2"
    rationale: "Without connected APIs, policies see nothing and cannot enforce or alert."
    remediation: |
      1. Defender for Cloud Apps > Settings > App connectors
      2. Connect Microsoft 365, Azure, and each sanctioned SaaS service
      3. Verify every connector shows Connected
      4. Review connector health monthly
    references:
      - https://learn.microsoft.com/en-us/defender-cloud-apps/enable-instant-visibility-protection-and-governance-actions-for-your-apps
    evaluate: |
      connectors = data.get("cloud_app_connectors", [])
      if not connectors:
          return "not_implemented"
      healthy = [c for c in connectors if str(c.get("status", "")).lower() in ("connected", "healthy")]
      if len(healthy) == len(connectors):
          return "implemented"
      return "partially_implemented" if healthy else "not_implemented"

  - id: CTRL-DEF-026
    title: "Conditional Access App Control Sessions Enforced"
    description: >
      Conditional Access App Control must be used for at least the highest-risk applications so
      sessions can be monitored and blocked in real time (download, upload, copy, print).
    severity: HIGH
    category: defender
    service: defender_cloud_apps
    compliance_mapping:
      iso27001_2022:
        - "A.8.20"
      nist_csf_2:
        - "PR.AA-05"
      nist_800_53_r5:
        - "AC-4"
      cis_controls_v8:
        - "13.6"
      zero_trust:
        - "apps.session_control"
      soc2:
        - "CC6.6"
    rationale: "Session controls stop exfiltration from unmanaged devices without blocking access."
    remediation: |
      1. Defender for Cloud Apps > Conditional Access App Control
      2. Create a session policy for high-risk apps
      3. Combine with a Conditional Access policy using "Use Conditional Access App Control"
      4. Start in monitor-only, then enforce block actions as needed
    references:
      - https://learn.microsoft.com/en-us/defender-cloud-apps/proxy-intro-aad
    evaluate: |
      policies = data.get("mcas_session_policies", [])
      if not policies:
          return "not_implemented"
      enforced = [p for p in policies if str(p.get("state", "")).lower() in ("enabled", "on", "active")]
      return "implemented" if enforced else "partially_implemented"

  - id: CTRL-DEF-027
    title: "Anomaly Detection Policies Enabled"
    description: >
      MDCA anomaly detection policies (impossible travel, unusual download volume, suspicious
      inbox rules, ransomware activity) must be enabled and scoped to all users.
    severity: HIGH
    category: defender
    service: defender_cloud_apps
    compliance_mapping:
      iso27001_2022:
        - "A.8.16"
      nist_csf_2:
        - "DE.AE-02"
      nist_800_53_r5:
        - "SI-4"
      cis_controls_v8:
        - "13.6"
      soc2:
        - "CC7.2"
    rationale: "Anomaly policies detect compromised accounts before data leaves the tenant."
    remediation: |
      1. Defender for Cloud Apps > Policies > Anomaly detection policies
      2. Enable each policy (impossible travel, activity from infrequent country, suspicious inbox rules)
      3. Set scope to All users and enable email notifications
    references:
      - https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy
    evaluate: |
      policies = data.get("mcas_anomaly_policies", [])
      if not policies:
          return "not_implemented"
      enabled = [p for p in policies if str(p.get("state", "")).lower() in ("enabled", "on", "active")]
      if len(enabled) == len(policies):
          return "implemented"
      return "partially_implemented" if enabled else "not_implemented"

  - id: CTRL-DEF-028
    title: "OAuth Application Permissions Governed"
    description: >
      OAuth apps consented in the tenant must be inventoried and over-permissioned apps revoked,
      otherwise a single malicious consent grant can persist access to mail and files.
    severity: CRITICAL
    category: defender
    service: defender_cloud_apps
    compliance_mapping:
      iso27001_2022:
        - "A.5.15"
        - "A.8.2"
      nist_csf_2:
        - "PR.AA-05"
      nist_800_53_r5:
        - "AC-6"
      cis_controls_v8:
        - "6.8"
      cis_m365_benchmark:
        - "1.3.1"
      zero_trust:
        - "apps.least_privilege"
      soc2:
        - "CC6.1"
    rationale: "Illicit consent grants survive password changes and bypass MFA entirely."
    remediation: |
      1. Defender for Cloud Apps > Investigate > OAuth apps
      2. Review apps with high-privilege Microsoft Graph permissions (Mail.Read, Files.ReadWrite.All)
      3. Revoke consent for unapproved apps and disable user consent in Entra ID
      4. Enable app governance alerts for new high-permission consents
    references:
      - https://learn.microsoft.com/en-us/defender-cloud-apps/manage-app-permissions
    evaluate: |
      apps = data.get("oauth_apps", [])
      if apps is None:
          return "not_applicable"
      risky = [
          a for a in apps
          if str(a.get("riskLevel", "")).lower() in ("high", "critical")
          or a.get("hasHighPrivilegePermissions") is True
      ]
      if not risky:
          return "implemented"
      return "partially_implemented" if len(risky) <= 3 else "not_implemented"

  - id: CTRL-DEF-029
    title: "Shadow IT Applications Reviewed and Sanctioned"
    description: >
      Discovered cloud applications must be triaged as sanctioned or unsanctioned, and usage of
      unsanctioned high-risk applications blocked through the policy engine.
    severity: MEDIUM
    category: defender
    service: defender_cloud_apps
    compliance_mapping:
      iso27001_2022:
        - "A.8.20"
      nist_csf_2:
        - "ID.RA-01"
      nist_800_53_r5:
        - "CM-7"
      cis_controls_v8:
        - "2.3"
      cis_m365_benchmark:
        - "6.4.1"
      soc2:
        - "CC6.6"
    rationale: "Unreviewed shadow IT stores corporate data outside contractual and DLP controls."
    remediation: |
      1. Defender for Cloud Apps > Cloud discovery > Discovered apps
      2. Filter by risk score and usage volume
      3. Tag each app as sanctioned or unsanctioned
      4. Create a policy blocking access to unsanctioned high-risk apps
    references:
      - https://learn.microsoft.com/en-us/defender-cloud-apps/governance-shadow-it
    evaluate: |
      apps = data.get("discovered_cloud_apps")
      if apps is None:
          return "not_applicable"
      untagged = [a for a in apps if not a.get("sanctioned")]
      risky_untagged = [
          a for a in untagged
          if (a.get("riskScore") or 0) >= 5
      ]
      if not risky_untagged:
          return "implemented"
      return "partially_implemented" if len(risky_untagged) <= 10 else "not_implemented"

  - id: CTRL-DEF-030
    title: "File Policies with DLP Integration Active"
    description: >
      MDCA file policies must be active for SharePoint, OneDrive and Teams so content matching
      sensitivity labels or DLP patterns is quarantined, restricted or alerted on.
    severity: HIGH
    category: defender
    service: defender_cloud_apps
    compliance_mapping:
      iso27001_2022:
        - "A.8.12"
      nist_csf_2:
        - "PR.DS-01"
      nist_800_53_r5:
        - "AC-4"
      cis_controls_v8:
        - "3.13"
      cis_m365_benchmark:
        - "6.4.2"
      soc2:
        - "CC6.7"
    rationale: "Files leave through sanctioned apps; only in-app file policies see that path."
    remediation: |
      1. Defender for Cloud Apps > Policies > File policies
      2. Create policies matching sensitivity labels and DLP content types
      3. Apply governance actions (quarantine, remove sharing, user notification)
      4. Scope to SharePoint, OneDrive and Teams
    references:
      - https://learn.microsoft.com/en-us/defender-cloud-apps/data-protection-policies
    evaluate: |
      policies = data.get("mcas_file_policies", [])
      if not policies:
          return "not_implemented"
      active = [p for p in policies if str(p.get("state", "")).lower() in ("enabled", "on", "active")]
      if active:
          return "implemented"
      return "partially_implemented" if policies else "not_implemented"
