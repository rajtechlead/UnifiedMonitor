# UniMonitor GRC Controls — Amazon Web Services

controls:
  - id: CTRL-AWS-001
    title: "Root Account MFA Enabled"
    description: >
      The AWS root user must have multi-factor authentication enabled. Root has
      unrestricted access and cannot be constrained by IAM policy.
    severity: CRITICAL
    category: cloud_security
    service: aws
    compliance_mapping:
      zero_trust:
        - "identity.mfa"
      iso27001_2022:
        - "A.8.5"
      nist_csf_2:
        - "PR.AA-03"
      nist_800_53_r5:
        - "IA-2(1)"
      cis_controls_v8:
        - "6.3"
      soc2:
        - "CC6.1"
      pci_dss_v4:
        - "8.4.2"
    evaluate: |
      enabled = data.get("aws_root_mfa_enabled")
      if enabled is None:
          return "not_applicable"
      return "implemented" if enabled else "not_implemented"
    remediation:
      summary: "Enable MFA on the root user and stop using it for day-to-day work."
      steps:
        - action: "Sign in as the root user, open IAM > Security credentials, and assign a hardware or virtual MFA device."
        - action: "Create an IAM Identity Center or IAM role for administrative work and delete root access keys."
        - action: "Enable an AWS Config rule or Security Hub control to alert if root MFA is removed."

  - id: CTRL-AWS-002
    title: "IAM Password Policy Enforces Complexity"
    description: >
      The account password policy must require at least 14 characters, upper and lower
      case, numbers, symbols, and a reuse prevention of 24 or more.
    severity: HIGH
    category: cloud_security
    service: aws
    compliance_mapping:
      zero_trust:
        - "identity.authentication"
      iso27001_2022:
        - "A.8.5"
      nist_csf_2:
        - "PR.AA-01"
      nist_800_53_r5:
        - "IA-5"
      cis_controls_v8:
        - "5.2"
      soc2:
        - "CC6.1"
    evaluate: |
      policy = data.get("aws_iam_password_policy")
      if not policy:
          return "not_implemented"
      checks = [
          (policy.get("MinimumPasswordLength") or 0) >= 14,
          policy.get("RequireUppercaseCharacters") is True,
          policy.get("RequireLowercaseCharacters") is True,
          policy.get("RequireSymbols") is True,
          policy.get("RequireNumbers") is True,
          (policy.get("PasswordReusePrevention") or 0) >= 24,
      ]
      passed = sum(1 for c in checks if c)
      if passed == len(checks):
          return "implemented"
      return "partially_implemented" if passed >= 4 else "not_implemented"
    remediation:
      summary: "Raise the account password policy to the baseline in the control description."
      steps:
        - action: "IAM > Account settings > Password policy: 14+ characters, upper/lower/numbers/symbols, reuse prevention 24."
        - action: "Apply with: aws iam update-account-password-policy --minimum-password-length 14 --require-symbols --require-numbers --require-uppercase-characters --require-lowercase-characters --password-reuse-prevention 24."
        - action: "Prefer federation (IAM Identity Center) so humans never hold IAM passwords."

  - id: CTRL-AWS-003
    title: "IAM Access Keys Rotated Within 90 Days"
    description: >
      Long-lived IAM access keys must be rotated at least every 90 days, or replaced with
      short-lived role credentials, to limit the impact of a leaked key.
    severity: HIGH
    category: cloud_security
    service: aws
    compliance_mapping:
      zero_trust:
        - "identity.credentials"
      iso27001_2022:
        - "A.8.5"
      nist_csf_2:
        - "PR.AA-05"
      nist_800_53_r5:
        - "IA-5"
      cis_controls_v8:
        - "5.4"
      soc2:
        - "CC6.1"
    evaluate: |
      from datetime import UTC, datetime

      keys = data.get("aws_access_keys")
      if keys is None:
          return "not_applicable"
      active = [k for k in keys if str(k.get("Status", "")).lower() == "active"]
      if not active:
          return "implemented"
      stale = 0
      for key in active:
          raw = str(key.get("CreateDate", ""))
          try:
              created = datetime.fromisoformat(raw.replace("Z", "+00:00"))
              if created.tzinfo is None:
                  created = created.replace(tzinfo=UTC)
              if (datetime.now(UTC) - created).days > 90:
                  stale += 1
          except ValueError:
              stale += 1
      if stale == 0:
          return "implemented"
      return "partially_implemented" if stale < len(active) else "not_implemented"
    remediation:
      summary: "Rotate or remove long-lived IAM access keys."
      steps:
        - action: "List keys with age: aws iam list-users, then aws iam list-access-keys for each user."
        - action: "Create a replacement key, deploy it, then deactivate and delete the old key."
        - action: "Move workloads to IAM roles or OIDC federation so keys are not needed at all."

  - id: CTRL-AWS-004
    title: "S3 Buckets Block Public Access and Encrypt at Rest"
    description: >
      Every S3 bucket must block all four public access settings and have default
      server-side encryption enabled.
    severity: CRITICAL
    category: cloud_security
    service: aws
    compliance_mapping:
      zero_trust:
        - "data.protection"
      iso27001_2022:
        - "A.8.12"
      nist_csf_2:
        - "PR.DS-01"
      nist_800_53_r5:
        - "SC-28"
      cis_controls_v8:
        - "3.3"
      soc2:
        - "CC6.7"
      pci_dss_v4:
        - "3.5.1"
      hipaa:
        - "164.312(a)(2)(iv)"
    evaluate: |
      buckets = data.get("aws_s3_buckets")
      if buckets is None:
          return "not_applicable"
      if not buckets:
          return "implemented"
      flags = (
          "BlockPublicAcls",
          "IgnorePublicAcls",
          "BlockPublicPolicy",
          "RestrictPublicBuckets",
      )
      failures = []
      for bucket in buckets:
          block = bucket.get("PublicAccessBlock") or {}
          public_ok = all(block.get(f) is True for f in flags)
          encrypted = bool(bucket.get("Encryption"))
          if not (public_ok and encrypted):
              failures.append(bucket.get("Name", "unknown"))
      if not failures:
          return "implemented"
      return "partially_implemented" if len(failures) < len(buckets) else "not_implemented"
    remediation:
      summary: "Block public S3 access and turn on default encryption for every bucket."
      steps:
        - action: "Enable Block Public Access at the account level: aws s3control put-public-access-block --account-id <id> --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true."
        - action: "Turn on default encryption (SSE-S3 or SSE-KMS) per bucket and in the account-level default."
        - action: "Re-check bucket policies and ACLs that were granting public read before the block."

  - id: CTRL-AWS-005
    title: "CloudTrail Multi-Region Logging Enabled"
    description: >
      A multi-region CloudTrail trail must be logging so API activity across all regions is
      captured for detection and audit.
    severity: HIGH
    category: cloud_security
    service: aws
    compliance_mapping:
      zero_trust:
        - "infrastructure.logging"
      iso27001_2022:
        - "A.8.15"
      nist_csf_2:
        - "DE.CM-03"
      nist_800_53_r5:
        - "AU-2"
      cis_controls_v8:
        - "8.5"
      soc2:
        - "CC7.2"
      pci_dss_v4:
        - "10.2.1"
    evaluate: |
      trails = data.get("aws_cloudtrail_trails")
      if trails is None:
          return "not_applicable"
      active = [
          t for t in trails
          if t.get("IsMultiRegionTrail") is True and t.get("IsLogging") is True
      ]
      if active:
          return "implemented"
      return "partially_implemented" if trails else "not_implemented"
    remediation:
      summary: "Run a multi-region CloudTrail trail with log-file validation."
      steps:
        - action: "Create or update a trail with IsMultiRegionTrail and EnableLogFileValidation set to true."
        - action: "Deliver logs to a dedicated, restricted S3 bucket with object lock and lifecycle retention."
        - action: "Turn on CloudTrail insights and alarms for StopLogging and DeleteTrail events."

  - id: CTRL-AWS-006
    title: "GuardDuty Threat Detection Enabled"
    description: >
      Amazon GuardDuty must have at least one enabled detector so account, network and
      data-access threats are detected continuously.
    severity: HIGH
    category: cloud_security
    service: aws
    compliance_mapping:
      zero_trust:
        - "secops.detection"
      iso27001_2022:
        - "A.8.16"
      nist_csf_2:
        - "DE.CM-01"
      nist_800_53_r5:
        - "SI-4"
      cis_controls_v8:
        - "13.1"
      soc2:
        - "CC7.2"
    evaluate: |
      detectors = data.get("aws_guardduty_detectors")
      if detectors is None:
          return "not_applicable"
      enabled = [d for d in detectors if str(d.get("Status", "")).upper() == "ENABLED"]
      return "implemented" if enabled else "not_implemented"
    remediation:
      summary: "Enable GuardDuty in every region and route findings to a responder."
      steps:
        - action: "Enable GuardDuty per region (Organizations can auto-enable for new accounts)."
        - action: "Export findings to Security Hub or EventBridge and page on High/Critical."
        - action: "Add S3, EKS and malware protection plans where the account uses those services."

  - id: CTRL-AWS-007
    title: "AWS Config Recording Enabled"
    description: >
      At least one AWS Config recorder must be recording so resource configuration changes
      are captured and can be evaluated against compliance rules.
    severity: MEDIUM
    category: cloud_security
    service: aws
    compliance_mapping:
      zero_trust:
        - "infrastructure.configuration"
      iso27001_2022:
        - "A.8.9"
      nist_csf_2:
        - "CM-2"
      nist_800_53_r5:
        - "CM-2"
      cis_controls_v8:
        - "4.1"
      soc2:
        - "CC7.1"
    evaluate: |
      recorders = data.get("aws_config_recorders")
      if recorders is None:
          return "not_applicable"
      recording = [r for r in recorders if r.get("recording") is True]
      return "implemented" if recording else "not_implemented"
    remediation:
      summary: "Enable AWS Config recording with the conformance packs that matter."
      steps:
        - action: "Create a configuration recorder and delivery channel in each region."
        - action: "Apply the CIS or FSBP conformance pack, and remediate non-compliant resources."
        - action: "Aggregate to an organisation aggregator so multi-account posture is visible."

  - id: CTRL-AWS-008
    title: "Security Hub Aggregation Enabled"
    description: >
      AWS Security Hub must be enabled so findings from GuardDuty, Config and partner
      products are aggregated into one prioritised queue.
    severity: MEDIUM
    category: cloud_security
    service: aws
    compliance_mapping:
      zero_trust:
        - "secops.visibility"
      iso27001_2022:
        - "A.8.16"
      nist_csf_2:
        - "DE.AE-02"
      nist_800_53_r5:
        - "RA-5"
      cis_controls_v8:
        - "7.1"
      soc2:
        - "CC7.1"
    evaluate: |
      enabled = data.get("aws_securityhub_enabled")
      if enabled is None:
          return "not_applicable"
      return "implemented" if enabled else "not_implemented"
    remediation:
      summary: "Turn on Security Hub and adopt a standard."
      steps:
        - action: "Enable Security Hub in the home region and the AWS Foundational Security Best Practices standard."
        - action: "Enable cross-region and cross-account aggregation."
        - action: "Route critical findings to the ticket queue used by the operations team."

  - id: CTRL-AWS-009
    title: "Security Groups Do Not Expose Management Ports to the Internet"
    description: >
      No security group may allow ingress from 0.0.0.0/0 or ::/0 to SSH (22),
      RDP (3389), database ports (3306, 5432, 1433, 27017) or other management
      services. Access is brokered by SSM Session Manager or a private bastion.
    severity: CRITICAL
    category: network_security
    service: aws
    compliance_mapping:
      zero_trust:
        - "network.segmentation"
      iso27001_2022:
        - "A.8.20"
      nist_csf_2:
        - "PR.IR-01"
      nist_800_53_r5:
        - "SC-7"
      cis_controls_v8:
        - "12.2"
      soc2:
        - "CC6.6"
    evaluate: |
      groups = data.get("aws_security_groups")
      if not groups:
          return "not_applicable"
      management_ports = {22, 3389, 3306, 5432, 1433, 27017, 6379, 9200}
      exposed = []
      for group in groups:
          for rule in group.get("IpPermissions") or []:
              public = any(cidr in ("0.0.0.0/0", "::/0") for cidr in rule.get("Cidrs") or [])
              if not public:
                  continue
              low = rule.get("FromPort")
              high = rule.get("ToPort")
              if low is None or high is None:
                  # Protocol -1 means all ports.
                  exposed.append(group.get("GroupId", ""))
                  continue
              if any(low <= port <= high for port in management_ports):
                  exposed.append(group.get("GroupId", ""))
      return "not_implemented" if exposed else "implemented"
    remediation:
      summary: "Remove public ingress on management ports and use SSM Session Manager instead."
      steps:
        - action: "Revoke the 0.0.0.0/0 ingress rules: aws ec2 revoke-security-group-ingress."
        - action: "Use SSM Session Manager or a bastion in a private subnet for administrative access."
        - action: "Enable an AWS Config rule or Security Hub control to alert on new public management ports."

  - id: CTRL-AWS-010
    title: "VPC Flow Logs Enabled and Active"
    description: >
      Network traffic in every VPC must be logged so lateral movement and data
      exfiltration can be investigated. At least one flow log must be ACTIVE and
      none may be in a failed state.
    severity: HIGH
    category: network_security
    service: aws
    compliance_mapping:
      zero_trust:
        - "network.logging"
      iso27001_2022:
        - "A.8.16"
      nist_csf_2:
        - "DE.CM-01"
      nist_800_53_r5:
        - "AU-12"
      cis_controls_v8:
        - "13.6"
      soc2:
        - "CC7.2"
    evaluate: |
      logs = data.get("aws_flow_logs")
      if logs is None:
          return "not_applicable"
      active = [log for log in logs if str(log.get("Status", "")).upper() == "ACTIVE"]
      if not active:
          return "not_implemented"
      failed = [log for log in logs if str(log.get("Status", "")).upper() not in ("ACTIVE", "")]
      return "partially_implemented" if failed else "implemented"
    remediation:
      summary: "Enable flow logs on every VPC and deliver them to the central log archive."
      steps:
        - action: "Create a flow log per VPC: aws ec2 create-flow-logs --resource-type VPC --traffic-type ALL."
        - action: "Deliver to CloudWatch Logs or S3 with the retention policy of the log archive account."

  - id: CTRL-AWS-011
    title: "Customer-Managed KMS Keys Rotate Annually"
    description: >
      Every enabled customer-managed KMS key must have automatic rotation on, so
      a leaked key is useful for at most one rotation period.
    severity: MEDIUM
    category: data_protection
    service: aws
    compliance_mapping:
      zero_trust:
        - "data.encryption"
      iso27001_2022:
        - "A.8.24"
      nist_csf_2:
        - "PR.DS-01"
      nist_800_53_r5:
        - "SC-12"
      soc2:
        - "CC6.1"
    evaluate: |
      keys = data.get("aws_kms_keys")
      if keys is None:
          return "not_applicable"
      enabled = [key for key in keys if key.get("Enabled", True)]
      if not enabled:
          return "not_applicable"
      rotating = [key for key in enabled if key.get("RotationEnabled")]
      if len(rotating) == len(enabled):
          return "implemented"
      return "partially_implemented" if rotating else "not_implemented"
    remediation:
      summary: "Enable annual rotation on every customer-managed key."
      steps:
        - action: "aws kms enable-key-rotation --key-id <key-id> for each customer-managed key."
        - action: "Prefer AWS-managed keys only where the workload has no compliance requirement for customer keys."

  - id: CTRL-AWS-012
    title: "Organizations Apply Service Control Policies"
    description: >
      Service control policies are the account-level guardrail for a zero trust
      identity plane: they bound what even an administrator can do, including
      disabling logging or using unapproved Regions.
    severity: HIGH
    category: identity_governance
    service: aws
    compliance_mapping:
      zero_trust:
        - "identity.governance"
      iso27001_2022:
        - "A.5.15"
      nist_csf_2:
        - "PR.AA-05"
      nist_800_53_r5:
        - "AC-6"
      soc2:
        - "CC6.3"
    evaluate: |
      policies = data.get("aws_organization_policies")
      if policies is None:
          return "not_applicable"
      return "implemented" if policies else "not_implemented"
    remediation:
      summary: "Enable Organizations and attach guardrail SCPs to every account."
      steps:
        - action: "Attach a deny-list SCP that blocks disabling CloudTrail/GuardDuty and restricts Regions."
        - action: "Test SCPs in a sandbox account before rolling out at the root."

  - id: CTRL-AWS-013
    title: "Instances Are Managed and Patched by Systems Manager"
    description: >
      Every EC2 instance must be visible to Systems Manager, online and running a
      supported agent version, so patch state and inventory are trustworthy.
    severity: HIGH
    category: endpoint_management
    service: aws
    compliance_mapping:
      zero_trust:
        - "devices.health"
      iso27001_2022:
        - "A.8.8"
      nist_csf_2:
        - "PR.PS-02"
      nist_800_53_r5:
        - "SI-2"
      cis_controls_v8:
        - "7.3"
      soc2:
        - "CC7.1"
    evaluate: |
      instances = data.get("aws_managed_instances")
      if instances is None:
          return "not_applicable"
      if not instances:
          return "not_implemented"
      healthy = [
          item
          for item in instances
          if str(item.get("PingStatus", "")).lower() == "online" and item.get("IsLatestVersion")
      ]
      if len(healthy) == len(instances):
          return "implemented"
      return "partially_implemented" if healthy else "not_implemented"
    remediation:
      summary: "Onboard instances to SSM and enforce a patch baseline."
      steps:
        - action: "Attach the AmazonSSMManagedInstanceCore policy to instance roles."
        - action: "Create a patch baseline and maintenance window per environment."

  - id: CTRL-AWS-014
    title: "IAM Access Analyzer Enabled"
    description: >
      Access Analyzer identifies resources shared outside the account and unused
      permissions, which is how a zero trust posture keeps converging on least
      privilege.
    severity: MEDIUM
    category: identity_governance
    service: aws
    compliance_mapping:
      zero_trust:
        - "identity.least_privilege"
      iso27001_2022:
        - "A.5.15"
      nist_csf_2:
        - "PR.AA-05"
      soc2:
        - "CC6.3"
    evaluate: |
      analyzers = data.get("aws_access_analyzers")
      if analyzers is None:
          return "not_applicable"
      active = [item for item in analyzers if str(item.get("status", "")).upper() == "ACTIVE"]
      return "implemented" if active else "not_implemented"
    remediation:
      summary: "Enable IAM Access Analyzer in every Region and review external access."
      steps:
        - action: "Create an account-level analyzer: aws accessanalyzer create-analyzer --analyzer-name default --type ACCOUNT."
        - action: "Triage active findings and archive reviewed ones with a reason."

