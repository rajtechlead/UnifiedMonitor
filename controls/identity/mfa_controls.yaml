# UniMonitor GRC Controls — Identity: MFA & Authentication

controls:
  - id: CTRL-ENT-001
    title: "Require MFA for All Users via Conditional Access"
    description: >
      A Conditional Access policy must be enabled that requires Multi-Factor Authentication
      for all users, excluding break-glass emergency accounts monitored separately.
    severity: CRITICAL
    category: identity
    service: entra_id
    compliance_mapping:
      iso27001_2022:
        - "A.8.5"
        - "A.8.3"
      nist_csf_2:
        - "PR.AA-02"
        - "PR.AA-03"
      nist_800_53_r5:
        - "IA-2(1)"
        - "IA-2(2)"
      cis_controls_v8:
        - "6.3"
        - "6.5"
      cis_m365_benchmark:
        - "1.1.1"
      zero_trust:
        - "identity.verify_explicitly"
      soc2:
        - "CC6.1"
      cmmc_2:
        - "IA.3.083"
      hipaa:
        - "164.312(a)(2)(i)"
      pci_dss_v4:
        - "8.4.2"
    rationale: "MFA prevents over 99.9% of account compromise attacks according to Microsoft research."
    remediation: |
      1. Navigate to Azure AD > Security > Conditional Access > New Policy
      2. Set Assignments > Users: All users (exclude break-glass accounts)
      3. Set Cloud apps or actions: All cloud apps
      4. Set Grant > Require multifactor authentication
      5. Enable the policy in Report-only mode first, then enforce
    references:
      - https://learn.microsoft.com/en-us/entra/identity/conditional-access/howto-conditional-access-policy-all-users-mfa
    evaluate: |
      policies = data.get("conditionalAccessPolicies", {}).get("value", [])
      if not policies:
          return "not_applicable"
      enabled = [p for p in policies if p.get("state") == "enabled"]
      mfa_all_users = []
      for p in enabled:
          conditions = p.get("conditions", {})
          users = conditions.get("users", {})
          include_all = "All" in users.get("includeUsers", [])
          grant = p.get("grantControls") or {}
          built_in = grant.get("builtInControls", [])
          if include_all and "mfa" in built_in:
              mfa_all_users.append(p)
      if mfa_all_users:
          return "implemented"
      # Check for report-only
      report_only = [p for p in policies if p.get("state") == "enabledForReportingButNotEnforced"]
      mfa_report = any(
          "All" in p.get("conditions", {}).get("users", {}).get("includeUsers", []) and
          "mfa" in (p.get("grantControls") or {}).get("builtInControls", [])
          for p in report_only
      )
      return "partially_implemented" if mfa_report else "not_implemented"

  - id: CTRL-ENT-002
    title: "Block Legacy Authentication Protocols"
    description: >
      A Conditional Access policy must block all legacy authentication protocols
      (Basic Auth, SMTP Auth, POP, IMAP, MAPI) that do not support MFA.
    severity: CRITICAL
    category: identity
    service: entra_id
    compliance_mapping:
      iso27001_2022:
        - "A.8.5"
      nist_csf_2:
        - "PR.AA-05"
      cis_m365_benchmark:
        - "1.1.3"
      zero_trust:
        - "identity.verify_explicitly"
      soc2:
        - "CC6.1"
      cmmc_2:
        - "IA.3.083"
    rationale: "Legacy auth bypasses MFA. Microsoft reports 97% of credential stuffing attacks use legacy protocols."
    remediation: |
      1. In Conditional Access, create a new policy
      2. Set Users: All users
      3. Set Conditions > Client apps: Exchange ActiveSync clients, Other clients (legacy)
      4. Set Grant: Block access
      5. Enable the policy
    references:
      - https://learn.microsoft.com/en-us/entra/identity/conditional-access/block-legacy-authentication
    evaluate: |
      policies = data.get("conditionalAccessPolicies", {}).get("value", [])
      enabled = [p for p in policies if p.get("state") == "enabled"]
      for p in enabled:
          client_apps = p.get("conditions", {}).get("clientAppTypes", [])
          blocks_legacy = any(app in client_apps for app in ["exchangeActiveSync", "other"])
          grant = p.get("grantControls") or {}
          blocks_access = grant.get("operator") == "OR" and "block" in grant.get("builtInControls", [])
          if blocks_legacy and blocks_access:
              return "implemented"
      return "not_implemented"

  - id: CTRL-ENT-003
    title: "Require Compliant or Hybrid-Joined Device"
    description: >
      A Conditional Access policy should require devices to be either Intune-compliant
      or Hybrid Azure AD joined for access to corporate resources.
    severity: HIGH
    category: identity
    service: entra_id
    compliance_mapping:
      iso27001_2022:
        - "A.8.1"
      nist_csf_2:
        - "PR.AA-05"
      cis_m365_benchmark:
        - "6.1.1"
      zero_trust:
        - "devices.verify_device_health"
      soc2:
        - "CC6.6"
      cmmc_2:
        - "SC.3.177"
    rationale: "Device-based controls ensure only managed endpoints access sensitive data."
    remediation: |
      1. In Conditional Access, create a new policy targeting All cloud apps
      2. Set Grant to: Require compliant device OR Require hybrid Azure AD joined device
      3. Apply to All users (with named location exclusions if needed)
    references:
      - https://learn.microsoft.com/en-us/entra/identity/conditional-access/require-compliant-device
    evaluate: |
      policies = data.get("conditionalAccessPolicies", {}).get("value", [])
      enabled = [p for p in policies if p.get("state") == "enabled"]
      for p in enabled:
          grant = p.get("grantControls") or {}
          built_in = grant.get("builtInControls", [])
          if "compliantDevice" in built_in or "domainJoinedDevice" in built_in:
              return "implemented"
      return "not_implemented"

  - id: CTRL-ENT-004
    title: "Security Defaults or Equivalent Controls Enabled"
    description: >
      Either Microsoft Security Defaults or equivalent Conditional Access policies must
      be enabled to enforce baseline MFA and block legacy auth.
    severity: HIGH
    category: identity
    service: entra_id
    compliance_mapping:
      iso27001_2022:
        - "A.8.5"
      cis_m365_benchmark:
        - "1.1.4"
      zero_trust:
        - "identity.verify_explicitly"
      nist_800_53_r5:
        - "AC-17"
    rationale: "Security Defaults provide free baseline protections for tenants not yet using Conditional Access."
    remediation: |
      If not using Conditional Access: Enable Security Defaults in Azure AD > Properties > Manage Security defaults
      If using Conditional Access: Ensure policies cover MFA and legacy auth block
    references:
      - https://learn.microsoft.com/en-us/entra/fundamentals/security-defaults
    evaluate: |
      sd = data.get("securityDefaults", {})
      sd_enabled = sd.get("isEnabled", False)
      if sd_enabled:
          return "implemented"
      # If security defaults off, check for CA policies instead
      policies = data.get("conditionalAccessPolicies", {}).get("value", [])
      enabled_ca = [p for p in policies if p.get("state") == "enabled"]
      if len(enabled_ca) >= 2:
          return "implemented"  # Assuming CA is intentionally replacing security defaults
      return "not_implemented"

  - id: CTRL-ENT-005
    title: "MFA Registration Campaign Configured"
    description: >
      A registration campaign should be configured in Authentication Methods policy
      to ensure users register for MFA within a defined timeframe.
    severity: MEDIUM
    category: identity
    service: entra_id
    compliance_mapping:
      iso27001_2022:
        - "A.8.5"
      cis_m365_benchmark:
        - "1.1.2"
      zero_trust:
        - "identity.verify_explicitly"
      nist_800_53_r5:
        - "IA-2"
    rationale: "Ensures all users are enrolled in MFA before it becomes mandatory."
    remediation: |
      1. Navigate to Azure AD > Security > Authentication methods > Registration campaign
      2. Set snoozeDurationInDays to 0 (no snooze) or a low value
      3. Assign to All users or target groups
    references:
      - https://learn.microsoft.com/en-us/entra/identity/authentication/how-to-mfa-registration-campaign
    evaluate: |
      policy = data.get("authMethodsPolicy", {})
      campaign = policy.get("registrationEnforcement", {}).get("authenticationMethodsRegistrationCampaign", {})
      state = campaign.get("state", "default")
      if state == "enabled":
          return "implemented"
      return "partially_implemented" if state != "disabled" else "not_implemented"
