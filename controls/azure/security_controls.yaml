# UniMonitor GRC Controls — Azure Security (Defender for Cloud, Security Center, Key Vault, Storage)
# 25 controls: CTRL-AZR-001 through CTRL-AZR-025

controls:
  - id: CTRL-AZR-001
    title: "Enable Microsoft Defender for Cloud (Standard Tier)"
    description: >
      Microsoft Defender for Cloud must be enabled at Standard tier (Defender plans)
      for all Azure subscriptions to provide advanced threat protection and security posture management.
    severity: CRITICAL
    category: cloud_security
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.8", "A.8.16"]
      nist_csf_2: ["DE.CM-01", "ID.RA-01"]
      nist_800_53_r5: ["SI-3", "SI-4"]
      cis_controls_v8: ["10.1", "13.1"]
      zero_trust: ["infrastructure.validate_explicitly"]
      soc2: ["CC7.1", "CC7.2"]
    rationale: "Defender for Cloud Standard provides just-in-time VM access, adaptive application controls, and advanced threat detection."
    remediation: |
      1. Navigate to Microsoft Defender for Cloud > Environment settings
      2. Select your subscription
      3. Enable all Defender plans (Servers, Storage, SQL, etc.)
      4. Set Auto provisioning > Log Analytics agent to On
    references:
      - https://learn.microsoft.com/en-us/azure/defender-for-cloud/enable-enhanced-security
    evaluate: |
      plans = data.get("defenderPlans", {}).get("value", [])
      if not plans:
          return "not_applicable"
      enabled = [p for p in plans if p.get("pricingTier") == "Standard"]
      total = len(plans)
      if total == 0:
          return "not_applicable"
      pct = len(enabled) / total
      if pct >= 0.8:
          return "pass"
      elif pct >= 0.5:
          return "partial"
      return "fail"

  - id: CTRL-AZR-002
    title: "Enable Secure Score Monitoring and Tracking"
    description: >
      Azure Secure Score must be monitored and the organization must maintain a score
      of at least 70% to demonstrate a strong security posture.
    severity: HIGH
    category: cloud_security
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.8"]
      nist_csf_2: ["ID.IM-02", "PR.IP-07"]
      cis_controls_v8: ["4.1"]
      zero_trust: ["infrastructure.assume_breach"]
      soc2: ["CC4.1"]
    rationale: "Secure Score provides a quantified view of security posture and prioritizes remediation actions."
    remediation: |
      1. Navigate to Defender for Cloud > Secure Score
      2. Review recommendations sorted by score impact
      3. Remediate high-impact recommendations first
      4. Set up weekly Secure Score export to Log Analytics
    references:
      - https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls
    evaluate: |
      score_data = data.get("secureScore", {})
      current = score_data.get("currentScore", 0)
      max_score = score_data.get("maxScore", 100)
      if max_score == 0:
          return "not_applicable"
      pct = (current / max_score) * 100
      if pct >= 70:
          return "pass"
      elif pct >= 50:
          return "partial"
      return "fail"

  - id: CTRL-AZR-003
    title: "Enable Azure Key Vault Soft Delete and Purge Protection"
    description: >
      All Azure Key Vaults must have Soft Delete enabled (90-day retention) and
      Purge Protection enabled to prevent accidental or malicious deletion of secrets and keys.
    severity: CRITICAL
    category: data_protection
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.10", "A.8.12"]
      nist_800_53_r5: ["CP-9", "SC-28"]
      cis_controls_v8: ["11.2", "11.3"]
      pci_dss_v4: ["3.5.1"]
      hipaa: ["164.312(a)(2)(iv)"]
      soc2: ["CC9.1", "A1.3"]
    rationale: "Soft delete and purge protection prevent irreversible loss of cryptographic keys and secrets."
    remediation: |
      1. Navigate to Key Vault > Properties
      2. Enable Soft-delete (minimum 90 days)
      3. Enable Purge protection
      4. Apply via Azure Policy: "Key vaults should have deletion protection enabled"
    references:
      - https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
    evaluate: |
      vaults = data.get("keyVaults", {}).get("value", [])
      if not vaults:
          return "not_applicable"
      compliant = [
          v for v in vaults
          if v.get("properties", {}).get("enableSoftDelete") is True
          and v.get("properties", {}).get("enablePurgeProtection") is True
      ]
      pct = len(compliant) / len(vaults)
      if pct == 1.0:
          return "pass"
      elif pct >= 0.8:
          return "partial"
      return "fail"

  - id: CTRL-AZR-004
    title: "Restrict Azure Key Vault Network Access with Private Endpoints"
    description: >
      Azure Key Vaults containing production secrets must disable public network access
      and use Private Endpoints to restrict access to authorized virtual networks only.
    severity: HIGH
    category: network_security
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.20", "A.8.21"]
      nist_800_53_r5: ["SC-7", "AC-4"]
      cis_controls_v8: ["12.2", "12.3"]
      zero_trust: ["network.verify_explicitly"]
      pci_dss_v4: ["1.3.2"]
    rationale: "Public Key Vault endpoints expose secrets to potential internet-based attacks."
    remediation: |
      1. Navigate to Key Vault > Networking
      2. Set Allow access from: Disabled (for public access)
      3. Add Private Endpoint connection in the same VNet as consuming services
      4. Update firewall rules to allow only specific VNets/IPs if private endpoints not feasible
    references:
      - https://learn.microsoft.com/en-us/azure/key-vault/general/private-link-service
    evaluate: |
      vaults = data.get("keyVaults", {}).get("value", [])
      if not vaults:
          return "not_applicable"
      secure = []
      for v in vaults:
          props = v.get("properties", {})
          network_acls = props.get("networkAcls", {})
          default_action = network_acls.get("defaultAction", "Allow")
          private_eps = props.get("privateEndpointConnections", [])
          if default_action == "Deny" or private_eps:
              secure.append(v)
      pct = len(secure) / len(vaults)
      if pct >= 0.9:
          return "pass"
      elif pct >= 0.5:
          return "partial"
      return "fail"

  - id: CTRL-AZR-005
    title: "Enable Azure Storage Account Secure Transfer Required"
    description: >
      All Azure Storage Accounts must enforce HTTPS-only access by enabling
      'Secure transfer required' to prevent unencrypted data transfer.
    severity: HIGH
    category: data_protection
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.24"]
      nist_800_53_r5: ["SC-8", "SC-28"]
      cis_controls_v8: ["3.10"]
      pci_dss_v4: ["4.2.1"]
      hipaa: ["164.312(e)(2)(ii)"]
      soc2: ["CC6.7"]
    rationale: "Disabling secure transfer allows data to be transferred over unencrypted HTTP connections."
    remediation: |
      1. Navigate to Storage Account > Configuration
      2. Set Secure transfer required: Enabled
      3. Apply Azure Policy: "Secure transfer to storage accounts should be enabled"
    references:
      - https://learn.microsoft.com/en-us/azure/storage/common/storage-require-secure-transfer
    evaluate: |
      accounts = data.get("storageAccounts", {}).get("value", [])
      if not accounts:
          return "not_applicable"
      compliant = [
          a for a in accounts
          if a.get("properties", {}).get("supportsHttpsTrafficOnly") is True
      ]
      pct = len(compliant) / len(accounts)
      if pct == 1.0:
          return "pass"
      elif pct >= 0.8:
          return "partial"
      return "fail"

  - id: CTRL-AZR-006
    title: "Disable Public Blob Access on Storage Accounts"
    description: >
      Azure Storage Accounts must disable anonymous public blob access to prevent
      unauthorized access to stored data.
    severity: HIGH
    category: data_protection
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.3"]
      nist_800_53_r5: ["AC-3", "AC-6"]
      cis_controls_v8: ["3.3"]
      zero_trust: ["data.verify_explicitly"]
      soc2: ["CC6.1"]
    rationale: "Public blob access allows unauthenticated internet access to storage container data."
    remediation: |
      1. Navigate to Storage Account > Configuration
      2. Set Allow Blob public access: Disabled
      3. Apply via Azure Policy at management group level
    references:
      - https://learn.microsoft.com/en-us/azure/storage/blobs/anonymous-read-access-prevent
    evaluate: |
      accounts = data.get("storageAccounts", {}).get("value", [])
      if not accounts:
          return "not_applicable"
      compliant = [
          a for a in accounts
          if a.get("properties", {}).get("allowBlobPublicAccess") is False
      ]
      pct = len(compliant) / len(accounts)
      if pct == 1.0:
          return "pass"
      elif pct >= 0.8:
          return "partial"
      return "fail"

  - id: CTRL-AZR-007
    title: "Enable Storage Account Infrastructure Encryption"
    description: >
      Azure Storage Accounts handling sensitive data must enable infrastructure-level
      double encryption (encryption at rest using both platform-managed and customer-managed keys).
    severity: MEDIUM
    category: data_protection
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.24"]
      nist_800_53_r5: ["SC-28(1)"]
      hipaa: ["164.312(a)(2)(iv)"]
      pci_dss_v4: ["3.5"]
      soc2: ["CC6.7"]
    rationale: "Infrastructure encryption provides an additional layer of encryption for sensitive data at rest."
    remediation: |
      1. Navigate to Storage Account > Encryption
      2. Enable Infrastructure encryption (can only be set at creation time)
      3. For existing accounts, migrate data to a new account with infrastructure encryption enabled
    references:
      - https://learn.microsoft.com/en-us/azure/storage/common/infrastructure-encryption-enable
    evaluate: |
      accounts = data.get("storageAccounts", {}).get("value", [])
      if not accounts:
          return "not_applicable"
      sensitive_tagged = [
          a for a in accounts
          if a.get("tags", {}).get("DataClassification") in ["Confidential", "Restricted", "PII"]
      ]
      if not sensitive_tagged:
          return "not_applicable"
      encrypted = [
          a for a in sensitive_tagged
          if a.get("properties", {}).get("encryption", {}).get("requireInfrastructureEncryption") is True
      ]
      pct = len(encrypted) / len(sensitive_tagged)
      if pct == 1.0:
          return "pass"
      elif pct >= 0.5:
          return "partial"
      return "fail"

  - id: CTRL-AZR-008
    title: "Enable Azure Monitor Diagnostic Settings on Critical Resources"
    description: >
      Azure Monitor diagnostic settings must be enabled on all critical resources
      (Key Vaults, Storage Accounts, NSGs) to capture audit and activity logs.
    severity: HIGH
    category: logging_monitoring
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.15", "A.8.16"]
      nist_csf_2: ["DE.AE-02", "DE.CM-01"]
      nist_800_53_r5: ["AU-2", "AU-3", "AU-12"]
      cis_controls_v8: ["8.2", "8.5"]
      soc2: ["CC7.2", "CC7.3"]
    rationale: "Without diagnostic logs, security incidents cannot be detected or investigated."
    remediation: |
      1. Navigate to each critical resource > Diagnostic settings
      2. Add diagnostic setting to send logs to Log Analytics Workspace
      3. Enable all log categories and metrics
      4. Apply via Azure Policy: "Deploy Diagnostic Settings for Key Vault to Log Analytics"
    references:
      - https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/diagnostic-settings
    evaluate: |
      diagnostic_data = data.get("diagnosticSettings", {})
      resources = diagnostic_data.get("resources", [])
      if not resources:
          return "not_applicable"
      with_diag = [r for r in resources if r.get("diagnosticSettingsCount", 0) > 0]
      pct = len(with_diag) / len(resources)
      if pct >= 0.9:
          return "pass"
      elif pct >= 0.6:
          return "partial"
      return "fail"

  - id: CTRL-AZR-009
    title: "Enable Azure Activity Log Retention for 365 Days"
    description: >
      Azure Activity Log must be retained for a minimum of 365 days to support
      incident investigation and compliance audit requirements.
    severity: HIGH
    category: logging_monitoring
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.15"]
      nist_800_53_r5: ["AU-11"]
      cis_controls_v8: ["8.3"]
      pci_dss_v4: ["10.7"]
      hipaa: ["164.312(b)"]
      soc2: ["CC7.3"]
    rationale: "Insufficient log retention prevents forensic analysis and compliance reporting for prior periods."
    remediation: |
      1. Navigate to Monitor > Activity log > Export Activity Logs
      2. Create a diagnostic setting to send to Log Analytics
      3. Set retention to 365 days or more
      4. Optionally archive to Storage Account for long-term retention
    references:
      - https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/activity-log
    evaluate: |
      log_profiles = data.get("logProfiles", {}).get("value", [])
      if not log_profiles:
          return "fail"
      for profile in log_profiles:
          retention = profile.get("properties", {}).get("retentionPolicy", {})
          days = retention.get("days", 0)
          enabled = retention.get("enabled", False)
          if enabled and days >= 365:
              return "pass"
          elif enabled and days >= 90:
              return "partial"
      return "fail"

  - id: CTRL-AZR-010
    title: "Restrict Azure Management Port (SSH/RDP) Access with Just-in-Time VM Access"
    description: >
      Virtual machine management ports (SSH/22, RDP/3389) must be protected with
      Defender for Cloud Just-in-Time (JIT) VM access to prevent brute-force attacks.
    severity: CRITICAL
    category: network_security
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.20", "A.8.5"]
      nist_800_53_r5: ["AC-17", "SC-7"]
      cis_controls_v8: ["4.4", "12.2"]
      zero_trust: ["network.assume_breach"]
      soc2: ["CC6.6"]
    rationale: "Open management ports are the most common attack vector for ransomware and lateral movement."
    remediation: |
      1. Navigate to Defender for Cloud > Workload protections > Just-in-time VM access
      2. Enable JIT on all VMs with open SSH/RDP ports
      3. Configure maximum request time (4 hours) and allowed source IPs
    references:
      - https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-usage
    evaluate: |
      vms = data.get("virtualMachines", {}).get("value", [])
      if not vms:
          return "not_applicable"
      jit_vms = data.get("jitVmAccess", {}).get("value", [])
      jit_ids = {v.get("id") for v in jit_vms if v.get("properties", {}).get("provisioningState") == "Succeeded"}
      vm_ids = {v.get("id") for v in vms}
      if not vm_ids:
          return "not_applicable"
      covered = vm_ids & jit_ids
      pct = len(covered) / len(vm_ids)
      if pct >= 0.9:
          return "pass"
      elif pct >= 0.5:
          return "partial"
      return "fail"

  - id: CTRL-AZR-011
    title: "Enable Azure Network Security Group Flow Logs"
    description: >
      NSG flow logs must be enabled on all production Network Security Groups and
      sent to Log Analytics with Traffic Analytics enabled for threat detection.
    severity: HIGH
    category: network_security
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.16", "A.8.20"]
      nist_800_53_r5: ["SI-4", "AU-2"]
      cis_controls_v8: ["8.2", "13.6"]
      soc2: ["CC7.2"]
    rationale: "NSG flow logs provide visibility into network traffic for threat hunting and incident investigation."
    remediation: |
      1. Navigate to Network Security Group > Monitoring > NSG flow logs
      2. Enable flow logs (Version 2) for all production NSGs
      3. Set retention to 30+ days
      4. Enable Traffic Analytics with 10-minute processing interval
    references:
      - https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-nsg-flow-logging-overview
    evaluate: |
      nsgs = data.get("networkSecurityGroups", {}).get("value", [])
      if not nsgs:
          return "not_applicable"
      flow_logs = data.get("nsgFlowLogs", {}).get("value", [])
      enabled_nsg_ids = {
          fl.get("properties", {}).get("targetResourceId")
          for fl in flow_logs
          if fl.get("properties", {}).get("enabled") is True
      }
      nsg_ids = {n.get("id") for n in nsgs}
      pct = len(nsg_ids & enabled_nsg_ids) / len(nsg_ids) if nsg_ids else 0
      if pct >= 0.9:
          return "pass"
      elif pct >= 0.5:
          return "partial"
      return "fail"

  - id: CTRL-AZR-012
    title: "Enable Azure RBAC and Remove Classic Administrators"
    description: >
      Azure subscriptions must use Azure RBAC (Role-Based Access Control) exclusively,
      with no classic co-administrators or service administrators remaining.
    severity: HIGH
    category: access_control
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.2", "A.8.3"]
      nist_800_53_r5: ["AC-6", "AC-2"]
      cis_controls_v8: ["5.1", "6.1"]
      zero_trust: ["identity.verify_explicitly"]
      soc2: ["CC6.1", "CC6.3"]
    rationale: "Classic administrators have no granular permissions and cannot be audited with modern tools."
    remediation: |
      1. Navigate to Subscription > Access control (IAM) > Classic administrators
      2. Remove all co-administrators
      3. Grant equivalent Azure RBAC roles instead
      4. Remove legacy account administrator if no longer needed
    references:
      - https://learn.microsoft.com/en-us/azure/role-based-access-control/rbac-and-directory-admin-roles
    evaluate: |
      classic_admins = data.get("classicAdministrators", {}).get("value", [])
      co_admins = [a for a in classic_admins if a.get("properties", {}).get("role") == "CoAdministrator"]
      if not co_admins:
          return "pass"
      return "fail"

  - id: CTRL-AZR-013
    title: "Limit Azure Subscription Owner Role Assignments"
    description: >
      The number of users with Owner role on Azure subscriptions must not exceed 3.
      Owner is the most privileged role and should follow least-privilege principles.
    severity: HIGH
    category: access_control
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.2", "A.9.2"]
      nist_800_53_r5: ["AC-6(5)"]
      cis_controls_v8: ["5.4"]
      zero_trust: ["identity.verify_explicitly"]
      cmmc_2: ["AC.3.018"]
    rationale: "Excess subscription owners increases blast radius for compromised accounts."
    remediation: |
      1. Navigate to Subscription > Access control (IAM) > Role assignments
      2. Filter by Role: Owner
      3. Remove excess owners; replace with Contributor or custom roles where needed
      4. Ensure at least 2 owners for redundancy (break-glass accounts)
    references:
      - https://learn.microsoft.com/en-us/azure/security/fundamentals/identity-management-best-practices
    evaluate: |
      role_assignments = data.get("roleAssignments", {}).get("value", [])
      owners = [
          r for r in role_assignments
          if r.get("properties", {}).get("roleDefinitionId", "").endswith("8e3af657-a8ff-443c-a75c-2fe8c4bcb635")
          and r.get("properties", {}).get("principalType") == "User"
      ]
      count = len(owners)
      if count <= 3:
          return "pass"
      elif count <= 5:
          return "partial"
      return "fail"

  - id: CTRL-AZR-014
    title: "Enable Microsoft Entra ID Protection for Azure Sign-ins"
    description: >
      Azure AD (Entra ID) Identity Protection must be licensed and configured with
      sign-in risk and user risk policies to automatically block high-risk sign-ins.
    severity: CRITICAL
    category: identity
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.5", "A.8.16"]
      nist_csf_2: ["DE.CM-03", "RS.AN-03"]
      nist_800_53_r5: ["SI-4", "IA-4"]
      cis_controls_v8: ["6.2", "13.1"]
      zero_trust: ["identity.verify_explicitly", "identity.assume_breach"]
    rationale: "Identity Protection uses ML to detect compromised credentials and risky sign-ins in real time."
    remediation: |
      1. Ensure Entra ID P2 licensing is assigned
      2. Navigate to Entra ID > Security > Identity Protection
      3. Configure User risk policy: Block at HIGH risk
      4. Configure Sign-in risk policy: Require MFA at MEDIUM+ risk
    references:
      - https://learn.microsoft.com/en-us/entra/id-protection/overview-identity-protection
    evaluate: |
      risk_policies = data.get("identityProtectionPolicies", {})
      user_risk = risk_policies.get("userRiskPolicy", {})
      signin_risk = risk_policies.get("signInRiskPolicy", {})
      ur_enabled = user_risk.get("isEnabled", False)
      sr_enabled = signin_risk.get("isEnabled", False)
      if ur_enabled and sr_enabled:
          return "pass"
      elif ur_enabled or sr_enabled:
          return "partial"
      return "fail"

  - id: CTRL-AZR-015
    title: "Configure Azure Security Center Email Notifications for High-Severity Alerts"
    description: >
      Defender for Cloud must be configured to send email notifications to the security
      team for high and critical severity alerts automatically.
    severity: MEDIUM
    category: incident_response
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.16", "A.6.8"]
      nist_csf_2: ["RS.CO-02", "DE.AE-04"]
      nist_800_53_r5: ["IR-6", "AU-5"]
      cis_controls_v8: ["17.4"]
      soc2: ["CC7.3", "CC7.4"]
    rationale: "Without automated notifications, high-severity alerts may go undetected for hours or days."
    remediation: |
      1. Navigate to Defender for Cloud > Environment settings > your subscription
      2. Select Email notifications
      3. Add security contact email addresses
      4. Enable: All users with the following roles: Owner
      5. Set notification severity: High and above
    references:
      - https://learn.microsoft.com/en-us/azure/defender-for-cloud/configure-email-notifications
    evaluate: |
      contacts = data.get("securityContacts", {}).get("value", [])
      if not contacts:
          return "fail"
      configured = [
          c for c in contacts
          if c.get("properties", {}).get("alertNotifications", {}).get("state") == "On"
          and c.get("properties", {}).get("emails")
      ]
      if configured:
          return "pass"
      return "fail"

  - id: CTRL-AZR-016
    title: "Enable Azure Defender for SQL on All SQL Databases"
    description: >
      Microsoft Defender for SQL must be enabled on all Azure SQL Databases and
      SQL Managed Instances to detect injection attacks, anomalous access, and vulnerabilities.
    severity: HIGH
    category: data_protection
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.8", "A.8.16"]
      nist_800_53_r5: ["SI-3", "SI-4"]
      pci_dss_v4: ["11.3.1", "12.6.3"]
      hipaa: ["164.312(c)(2)"]
      soc2: ["CC7.1"]
    rationale: "SQL injection and anomalous query patterns are detected by Defender for SQL's behavioral analytics."
    remediation: |
      1. Navigate to SQL Database > Security > Microsoft Defender for SQL
      2. Enable Microsoft Defender for SQL: On
      3. Configure vulnerability assessment with storage account
      4. Set Threat Detection alerts notification email
    references:
      - https://learn.microsoft.com/en-us/azure/azure-sql/database/azure-defender-for-sql
    evaluate: |
      sql_dbs = data.get("sqlDatabases", {}).get("value", [])
      if not sql_dbs:
          return "not_applicable"
      defender_enabled = [
          db for db in sql_dbs
          if db.get("defenderStatus", {}).get("state") == "Enabled"
      ]
      pct = len(defender_enabled) / len(sql_dbs)
      if pct >= 0.9:
          return "pass"
      elif pct >= 0.5:
          return "partial"
      return "fail"

  - id: CTRL-AZR-017
    title: "Enforce Azure SQL Database Transparent Data Encryption (TDE)"
    description: >
      Transparent Data Encryption must be enabled on all Azure SQL Databases,
      SQL Managed Instances, and SQL Data Warehouses to protect data at rest.
    severity: HIGH
    category: data_protection
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.24"]
      nist_800_53_r5: ["SC-28"]
      pci_dss_v4: ["3.5.1"]
      hipaa: ["164.312(a)(2)(iv)"]
      soc2: ["CC6.7"]
    rationale: "TDE encrypts the entire database, backups, and transaction logs without application changes."
    remediation: |
      1. Navigate to SQL Database > Security > Transparent data encryption
      2. Set Data encryption: On
      3. Apply Azure Policy: "Transparent Data Encryption on SQL databases should be enabled"
    references:
      - https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-tde-overview
    evaluate: |
      sql_dbs = data.get("sqlDatabases", {}).get("value", [])
      if not sql_dbs:
          return "not_applicable"
      tde_enabled = [
          db for db in sql_dbs
          if db.get("transparentDataEncryption", {}).get("state") == "Enabled"
      ]
      pct = len(tde_enabled) / len(sql_dbs)
      if pct == 1.0:
          return "pass"
      elif pct >= 0.8:
          return "partial"
      return "fail"

  - id: CTRL-AZR-018
    title: "Configure Azure SQL Auditing to Log Analytics"
    description: >
      Azure SQL Database auditing must be enabled and logs sent to a Log Analytics
      Workspace for centralized security monitoring and compliance reporting.
    severity: HIGH
    category: logging_monitoring
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.15"]
      nist_800_53_r5: ["AU-2", "AU-12"]
      pci_dss_v4: ["10.3.1", "10.3.2"]
      hipaa: ["164.312(b)"]
      soc2: ["CC7.2"]
    rationale: "SQL audit logs capture all queries, logins, and schema changes for incident investigation."
    remediation: |
      1. Navigate to SQL Database > Auditing
      2. Set Auditing to On
      3. Select Log Analytics destination
      4. Set retention to 90+ days
    references:
      - https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-overview
    evaluate: |
      sql_dbs = data.get("sqlDatabases", {}).get("value", [])
      if not sql_dbs:
          return "not_applicable"
      audited = [
          db for db in sql_dbs
          if db.get("auditingSettings", {}).get("state") == "Enabled"
          and db.get("auditingSettings", {}).get("logAnalyticsTargetState") == "Enabled"
      ]
      pct = len(audited) / len(sql_dbs)
      if pct >= 0.9:
          return "pass"
      elif pct >= 0.6:
          return "partial"
      return "fail"

  - id: CTRL-AZR-019
    title: "Restrict SQL Database Public Endpoint Access"
    description: >
      Azure SQL Databases must disable public network access and use Private Endpoints
      or Virtual Network service endpoints to restrict access.
    severity: HIGH
    category: network_security
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.20", "A.8.21"]
      nist_800_53_r5: ["SC-7", "AC-4"]
      pci_dss_v4: ["1.3.2"]
      zero_trust: ["network.verify_explicitly"]
    rationale: "Public SQL endpoints expose databases to brute-force and exploitation from the internet."
    remediation: |
      1. Navigate to SQL Server > Security > Networking
      2. Set Public network access: Disable
      3. Add Private Endpoint connection
    references:
      - https://learn.microsoft.com/en-us/azure/azure-sql/database/private-endpoint-overview
    evaluate: |
      sql_servers = data.get("sqlServers", {}).get("value", [])
      if not sql_servers:
          return "not_applicable"
      secure = [
          s for s in sql_servers
          if s.get("properties", {}).get("publicNetworkAccess") == "Disabled"
      ]
      pct = len(secure) / len(sql_servers)
      if pct >= 0.9:
          return "pass"
      elif pct >= 0.5:
          return "partial"
      return "fail"

  - id: CTRL-AZR-020
    title: "Enable Azure Web Application Firewall (WAF) on Application Gateways"
    description: >
      Azure Application Gateways exposing web applications must have Web Application Firewall
      enabled in Prevention mode with OWASP Core Rule Set 3.2 or later.
    severity: HIGH
    category: network_security
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.20", "A.8.22"]
      nist_800_53_r5: ["SC-7", "SI-3"]
      pci_dss_v4: ["6.4.1", "6.4.2"]
      soc2: ["CC6.6"]
    rationale: "WAF blocks OWASP Top 10 attacks including SQL injection and XSS before they reach the application."
    remediation: |
      1. Navigate to Application Gateway > Web Application Firewall
      2. Enable WAF: Yes
      3. Set Firewall mode: Prevention
      4. Set Rule set: OWASP 3.2
    references:
      - https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
    evaluate: |
      app_gateways = data.get("applicationGateways", {}).get("value", [])
      if not app_gateways:
          return "not_applicable"
      waf_enabled = [
          g for g in app_gateways
          if g.get("properties", {}).get("webApplicationFirewallConfiguration", {}).get("enabled") is True
          and g.get("properties", {}).get("webApplicationFirewallConfiguration", {}).get("firewallMode") == "Prevention"
      ]
      pct = len(waf_enabled) / len(app_gateways)
      if pct == 1.0:
          return "pass"
      elif pct >= 0.5:
          return "partial"
      return "fail"

  - id: CTRL-AZR-021
    title: "Enable Azure DDoS Protection Standard on Production VNets"
    description: >
      Production Virtual Networks must have Azure DDoS Protection Standard enabled
      to automatically mitigate volumetric, protocol, and application layer DDoS attacks.
    severity: MEDIUM
    category: network_security
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.22"]
      nist_800_53_r5: ["SC-5"]
      cis_controls_v8: ["12.3"]
      soc2: ["A1.1", "A1.2"]
    rationale: "DDoS Protection Standard provides adaptive tuning and attack telemetry for production workloads."
    remediation: |
      1. Create an Azure DDoS Protection plan
      2. Navigate to Virtual Network > DDoS protection
      3. Enable DDoS protection and select the plan
    references:
      - https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-overview
    evaluate: |
      vnets = data.get("virtualNetworks", {}).get("value", [])
      if not vnets:
          return "not_applicable"
      prod_vnets = [v for v in vnets if "prod" in v.get("name", "").lower() or "production" in str(v.get("tags", {})).lower()]
      if not prod_vnets:
          return "not_applicable"
      ddos_enabled = [
          v for v in prod_vnets
          if v.get("properties", {}).get("ddosProtectionPlan") is not None
          and v.get("properties", {}).get("enableDdosProtection") is True
      ]
      pct = len(ddos_enabled) / len(prod_vnets)
      if pct >= 0.9:
          return "pass"
      elif pct >= 0.5:
          return "partial"
      return "fail"

  - id: CTRL-AZR-022
    title: "Restrict Azure Container Registry to Private Access Only"
    description: >
      Azure Container Registries must disable public network access and use Private
      Endpoints to prevent unauthorized image pulls and pushes from the internet.
    severity: HIGH
    category: network_security
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.20"]
      nist_800_53_r5: ["SC-7", "CM-7"]
      cis_controls_v8: ["4.8", "12.2"]
      zero_trust: ["infrastructure.verify_explicitly"]
    rationale: "Public container registries can be used to poison supply chains via unauthorized image pushes."
    remediation: |
      1. Navigate to Container Registry > Networking
      2. Set Public network access: Disabled
      3. Add Private Endpoint in the same VNet as AKS/app services
    references:
      - https://learn.microsoft.com/en-us/azure/container-registry/container-registry-private-link
    evaluate: |
      registries = data.get("containerRegistries", {}).get("value", [])
      if not registries:
          return "not_applicable"
      private_only = [
          r for r in registries
          if r.get("properties", {}).get("publicNetworkAccess") == "Disabled"
      ]
      pct = len(private_only) / len(registries)
      if pct >= 0.9:
          return "pass"
      elif pct >= 0.5:
          return "partial"
      return "fail"

  - id: CTRL-AZR-023
    title: "Enable Vulnerability Assessment on Azure Container Images"
    description: >
      Microsoft Defender for Containers must be enabled to scan container images in
      Azure Container Registry for known vulnerabilities continuously.
    severity: HIGH
    category: cloud_security
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.8"]
      nist_800_53_r5: ["SI-2", "RA-5"]
      cis_controls_v8: ["7.1", "7.4"]
      soc2: ["CC7.1"]
    rationale: "Container images often contain outdated OS packages and application dependencies with CVEs."
    remediation: |
      1. Navigate to Defender for Cloud > Environment settings
      2. Enable Defender for Containers plan
      3. Ensure ACR is covered under the plan
    references:
      - https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-introduction
    evaluate: |
      plans = data.get("defenderPlans", {}).get("value", [])
      containers_plan = next((p for p in plans if p.get("name") == "Containers"), None)
      if not containers_plan:
          return "fail"
      if containers_plan.get("pricingTier") == "Standard":
          return "pass"
      return "fail"

  - id: CTRL-AZR-024
    title: "Enforce Azure Policy: Require Resource Tagging"
    description: >
      An Azure Policy must be assigned at the management group or subscription level
      requiring at minimum the tags: Environment, Owner, CostCenter, and DataClassification.
    severity: MEDIUM
    category: governance
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.1"]
      nist_800_53_r5: ["CM-8"]
      cis_controls_v8: ["1.1"]
      soc2: ["CC1.4"]
    rationale: "Resource tagging enables cost attribution, ownership tracking, and security classification."
    remediation: |
      1. Navigate to Azure Policy > Definitions
      2. Search for "Require a tag and its value on resources"
      3. Assign policy for each required tag at management group level
      4. Set effect to Deny for new resources, Audit for existing
    references:
      - https://learn.microsoft.com/en-us/azure/governance/policy/samples/built-in-policies
    evaluate: |
      policy_assignments = data.get("policyAssignments", {}).get("value", [])
      required_tags = {"Environment", "Owner", "CostCenter", "DataClassification"}
      enforced_tags = set()
      for pa in policy_assignments:
          params = pa.get("properties", {}).get("parameters", {})
          tag_name = params.get("tagName", {}).get("value", "")
          if tag_name in required_tags:
              enforced_tags.add(tag_name)
      if required_tags.issubset(enforced_tags):
          return "pass"
      elif len(enforced_tags) >= 2:
          return "partial"
      return "fail"

  - id: CTRL-AZR-025
    title: "Enable Microsoft Sentinel (SIEM) Connected to Azure Log Analytics"
    description: >
      Microsoft Sentinel must be deployed and connected to the organization's Log Analytics
      Workspace to provide SIEM/SOAR capabilities for security event correlation and response.
    severity: HIGH
    category: logging_monitoring
    service: azure_security
    compliance_mapping:
      iso27001_2022: ["A.8.15", "A.8.16"]
      nist_csf_2: ["DE.AE-02", "RS.AN-03"]
      nist_800_53_r5: ["SI-4", "IR-4"]
      cis_controls_v8: ["8.11", "17.6"]
      soc2: ["CC7.3", "CC7.4"]
    rationale: "Sentinel provides ML-based threat detection, automated response playbooks, and compliance reporting."
    remediation: |
      1. Navigate to Microsoft Sentinel > Create
      2. Select or create a Log Analytics Workspace
      3. Connect data connectors: Microsoft 365 Defender, Entra ID, Azure Activity
      4. Enable built-in analytics rules
    references:
      - https://learn.microsoft.com/en-us/azure/sentinel/quickstart-onboard
    evaluate: |
      sentinel = data.get("sentinelWorkspace", {})
      if not sentinel:
          return "fail"
      if sentinel.get("provisioningState") == "Succeeded":
          connectors = sentinel.get("dataConnectors", [])
          if len(connectors) >= 3:
              return "pass"
          elif len(connectors) >= 1:
              return "partial"
          return "partial"
      return "fail"
