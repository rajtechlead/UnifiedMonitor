<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="UniMonitor logo">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1776D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1776D2;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#00BCD4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1776D2;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Shield icon -->
  <g transform="translate(8, 8)">
    <path d="M32 4 L58 14 L58 36 C58 50 46 60 32 64 C18 60 6 50 6 36 L6 14 Z"
          fill="url(#shieldGrad)" stroke="none"/>
    <!-- Checkmark inside shield -->
    <polyline points="20,34 28,42 44,26"
              fill="none" stroke="white" stroke-width="4"
              stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pulse ring -->
    <circle cx="32" cy="34" r="22" fill="none" stroke="url(#pulseGrad)"
            stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
  </g>

  <!-- "Uni" text -->
  <text x="82" y="48"
        font-family="'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif"
        font-size="32" font-weight="700" letter-spacing="-0.5"
        fill="#1776D2">Uni</text>

  <!-- "Monitor" text -->
  <text x="136" y="48"
        font-family="'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif"
        font-size="32" font-weight="300" letter-spacing="-0.5"
        fill="#1A1F2E">Monitor</text>

  <!-- Tagline -->
  <text x="82" y="66"
        font-family="'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif"
        font-size="10" font-weight="400" letter-spacing="2"
        fill="#6B7A99" text-anchor="start">UNIFIED M365 GRC PLATFORM</text>
</svg>
